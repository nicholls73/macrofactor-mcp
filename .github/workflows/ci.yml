name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  terraform:
    name: Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: hashFiles('infra/*.tf', 'infra/*.tf.json') != ''
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: hashFiles('infra/*.tf', 'infra/*.tf.json') != ''
      - run: npm run build
        if: hashFiles('infra/*.tf', 'infra/*.tf.json') != ''
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        if: hashFiles('infra/*.tf', 'infra/*.tf.json') != ''
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - name: Validate Terraform
        if: hashFiles('infra/*.tf', 'infra/*.tf.json') != ''
        run: |
          terraform -chdir=infra init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra fmt -check -recursive
          terraform -chdir=infra validate
          terraform -chdir=infra test
